# ADR-0028 — index CI conclusions as delivery.ci JSONL (artifact only; not committed).
name: Delivery observability

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Burst merges on the same branch fire one CI completion per push; without concurrency
# the Actions UI shows many identical "Delivery observability" runs. Keep only the
# latest ingest per branch (GitHub docs: workflow syntax → concurrency).
concurrency:
  group: delivery-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  ingest:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'sandbox'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Record delivery.ci check conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-delivery-ci.mjs --workflow-run
      - name: Upload delivery-ci artifact
        uses: actions/upload-artifact@v7
        with:
          name: delivery-ci-events-${{ github.event.workflow_run.id }}
          path: delivery-ci-events.jsonl
          if-no-files-found: ignore
          retention-days: 30
